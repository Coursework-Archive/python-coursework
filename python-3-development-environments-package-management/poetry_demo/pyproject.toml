[project]
name = "poetry-demo"
version = "0.1.0"
description = ""
authors = [
    {name = "Brittany Lynn Bales",email = "tamarkib@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arrow (==1.1)",
]

[tool.poetry]
packages = [{include = "poetry_demo", from = "src"}]

[tool.poetry.scripts]
showtime = 'poetry_demo.scripts:main'

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"


[tool.poetry.group.test.dependencies]
black = "^25.1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
